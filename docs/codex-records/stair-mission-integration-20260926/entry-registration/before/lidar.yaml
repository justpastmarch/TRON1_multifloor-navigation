# Operator measurements: 9+10 risers, rise .17m, tread .28m, width 1.23m;
# landing width 2.70m/depth 1.48m. Source: docs/stair-driving-repair-20260922/evidence/recovered-site.json.
# Route origin: first riser face, flight-1 centerline, body height at entry = 0.
# Geometry follows the existing simulation rectangle convention; first flight
# runs 9*.28m to the landing. Verify the overlay at the physical entry before use.
# Explicit placement: body center x=-.45m,y=0, facing upstairs. Body is .45m square.
# Operator requested full forward input in both stair flights.
# min_flight_v = max_v = .55 / robot.yaml full scale .55 = websocket 1.0.
# This is command normalization, NOT a measured speed or proof of stair torque.
# Slew and boundary filtering can temporarily command less; diagnostics expose it.
# Entry preview may be inspected for 120s in the same tracking epoch.
# Current geometry must still be fresh; this is an operator trial window, not a measured drift bound.
# Existing .02m margin + .10m anchor budget are retained, not newly validated.
# Uses existing Supervisor/phase_test only. Normal missions remain uncommissioned.
