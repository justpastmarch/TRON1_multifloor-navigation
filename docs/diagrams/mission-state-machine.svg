<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TRON1 mission and subsystem state machines</title>
  <desc id="desc">Mission FSM states and the floor transition and stair supervisor states used by the system.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">State-machine structure</text>
  <text x="60" y="80" font-family="sans-serif" font-size="16" fill="#475569">Mission FSM owns orchestration; floor and stair nodes expose independent safety states.</text>
  <g font-family="sans-serif" text-anchor="middle" font-size="15">
    <rect x="55" y="125" width="1090" height="220" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="85" y="157" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">MissionFSM</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="95" y="220" width="150" height="58" rx="12"/><rect x="300" y="220" width="150" height="58" rx="12"/><rect x="505" y="220" width="150" height="58" rx="12"/><rect x="710" y="220" width="150" height="58" rx="12"/><rect x="915" y="220" width="150" height="58" rx="12"/></g>
    <g fill="#1e3a8a" font-weight="700"><text x="170" y="255">WAIT_GOAL</text><text x="375" y="255">PLAN_MISSION</text><text x="580" y="255">EXECUTE_SEGMENT</text><text x="785" y="255">NEXT_SEGMENT</text><text x="990" y="255">MISSION_COMPLETE</text></g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M245 249 H300"/><path d="M450 249 H505"/><path d="M655 249 H710"/><path d="M860 249 H915"/><path d="M580 278 V312 H490 V278"/></g>
    <text x="272" y="239" fill="#475569">GOAL_RECEIVED</text><text x="477" y="239" fill="#475569">PLAN_SUCCEEDED</text><text x="682" y="239" fill="#475569">SEGMENT_SUCCEEDED</text><text x="887" y="239" fill="#475569">ALL_COMPLETE</text><text x="535" y="330" fill="#475569">MORE_SEGMENTS</text>
    <rect x="390" y="290" width="180" height="38" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="480" y="315" fill="#7f1d1d" font-weight="700">MISSION_ABORT</text>
    <path d="M375 278 V309 H390" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580 278 V309 H570" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M710 278 V312 H480" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="303" fill="#991b1b">CANCEL / TIMEOUT</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="15">
    <rect x="55" y="390" width="520" height="250" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="85" y="422" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">Floor transition</text>
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2"><rect x="90" y="465" width="145" height="52" rx="12"/><rect x="275" y="465" width="145" height="52" rx="12"/><rect x="460" y="465" width="85" height="52" rx="12"/></g>
    <text x="162" y="497" fill="#4c1d95" font-weight="700">READY</text><text x="347" y="497" fill="#4c1d95" font-weight="700">TRANSITIONING</text><text x="502" y="497" fill="#4c1d95" font-weight="700">FAULT</text>
    <path d="M235 491 H275" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M420 491 H460" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M347 517 V540 H162 V517" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="255" y="481" fill="#475569">goal</text><text x="440" y="481" fill="#991b1b">failure</text><text x="255" y="555" fill="#166534">policy ready</text>
    <text x="100" y="570" text-anchor="start" fill="#475569">TRANSITIONING:</text><text x="100" y="594" text-anchor="start" fill="#64748b">ARM_TARGET → TAG → CHANGE_MAP</text><text x="100" y="618" text-anchor="start" fill="#64748b">→ INITIALPOSE → AMCL_READY → COSTMAP_READY → POLICY_READY</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="15">
    <rect x="625" y="390" width="520" height="250" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="655" y="422" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">Stair supervisor</text>
    <g fill="#fce7f3" stroke="#db2777" stroke-width="2"><rect x="665" y="465" width="120" height="52" rx="12"/><rect x="820" y="465" width="120" height="52" rx="12"/><rect x="975" y="465" width="120" height="52" rx="12"/></g>
    <text x="725" y="497" fill="#831843" font-weight="700">DISARMED</text><text x="880" y="497" fill="#831843" font-weight="700">NAV</text><text x="1035" y="497" fill="#831843" font-weight="700">STAIR</text>
    <path d="M785 491 H820" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M940 491 H975" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1035 517 V555 H880 V517" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="802" y="481" fill="#475569">start</text><text x="958" y="481" fill="#475569">stair goal</text><text x="955" y="548" fill="#475569">complete + zero barrier</text>
    <rect x="820" y="570" width="120" height="38" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="880" y="595" fill="#7f1d1d" font-weight="700">FAULT</text><path d="M880 517 V570" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
