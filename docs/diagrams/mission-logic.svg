<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TRON1 mission logic flow</title>
  <desc id="desc">Mission goal flows through validation, directed graph planning, segment execution, floor transition and stair supervision, then returns a result and optional scan artifact.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Mission logic</text>
  <text x="60" y="88" font-family="sans-serif" font-size="16" fill="#475569">Mission.action → route expansion → exclusive execution → result/artifact</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" filter="url(#shadow)">
    <rect x="60" y="140" width="190" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="174" font-weight="700" fill="#1e3a8a">Mission goal</text><text x="155" y="198" fill="#1e40af">destination + type</text>
    <rect x="310" y="140" width="190" height="78" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="405" y="174" font-weight="700" fill="#4c1d95">Validate</text><text x="405" y="198" fill="#5b21b6">IDs, profile, readiness</text>
    <rect x="560" y="140" width="190" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="655" y="174" font-weight="700" fill="#14532d">BuildingPlanner</text><text x="655" y="198" fill="#166534">directed BFS</text>
    <rect x="810" y="140" width="190" height="78" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="905" y="174" font-weight="700" fill="#78350f">Expand route</text><text x="905" y="198" fill="#92400e">NAV / STAIR / FLOOR</text>
  </g>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M250 179 H310"/><path d="M500 179 H560"/><path d="M750 179 H810"/><path d="M905 218 V300"/></g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" filter="url(#shadow)">
    <rect x="810" y="300" width="190" height="78" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="905" y="334" font-weight="700" fill="#7c2d12">Execute segment</text><text x="905" y="358" fill="#9a3412">one at a time</text>
    <rect x="560" y="300" width="190" height="78" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="655" y="334" font-weight="700" fill="#0c4a6e">NAV segment</text><text x="655" y="358" fill="#075985">move_base + gates</text>
    <rect x="310" y="300" width="190" height="78" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="405" y="334" font-weight="700" fill="#831843">STAIR segment</text><text x="405" y="358" fill="#9d174d">exclusive supervisor</text>
    <rect x="60" y="300" width="190" height="78" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="155" y="334" font-weight="700" fill="#581c87">FLOOR transition</text><text x="155" y="358" fill="#6b21a8">map + AMCL + policy</text>
  </g>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M810 339 H750"/><path d="M560 339 H500"/><path d="M310 339 H250"/><path d="M155 378 V470"/><path d="M405 378 V470"/><path d="M655 378 V470"/></g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" filter="url(#shadow)">
    <rect x="60" y="470" width="190" height="78" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="155" y="504" font-weight="700" fill="#7f1d1d">Transition gate</text><text x="155" y="528" fill="#991b1b">tag + localized + costmap</text>
    <rect x="310" y="470" width="190" height="78" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="405" y="504" font-weight="700" fill="#7f1d1d">Stair evidence</text><text x="405" y="528" fill="#991b1b">phase + odom + timeout</text>
    <rect x="560" y="470" width="190" height="78" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="655" y="504" font-weight="700" fill="#7f1d1d">Navigation result</text><text x="655" y="528" fill="#991b1b">success / retry / fail</text>
    <rect x="810" y="470" width="190" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="905" y="504" font-weight="700" fill="#14532d">Next segment?</text><text x="905" y="528" fill="#166534">yes → execute</text>
    <rect x="435" y="635" width="330" height="72" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="600" y="666" font-weight="700" fill="#fff">Mission result</text><text x="600" y="690" fill="#cbd5e1">OK / error code / artifact_path</text>
  </g>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M250 509 C320 575 390 600 435 660"/><path d="M500 509 C520 565 540 610 560 635"/><path d="M750 509 C720 575 680 615 650 635"/><path d="M810 509 C760 570 710 590 650 635"/><path d="M905 548 V590 H1005 V339 H1000"/></g>
  <text x="60" y="735" font-family="sans-serif" font-size="14" fill="#64748b">Failure, cancellation, timeout, stale evidence, or communication loss terminates safely without starting a return route.</text>
</svg>
