    rostopic pub -1 /multifloor/floor_transition/goal
    multifloor_manager/FloorTransitionActionGoal <manual-todo12-final-invalid-goal>
  observed:
    goal_id: manual-todo12-final
    action_status: 4
    result_code: 2
    map_generation: 0
    reason: goal is not the current directed stair
