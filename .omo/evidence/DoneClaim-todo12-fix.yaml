    map: pre-arm and stale-load-time target maps cannot advance generation
    pose: initialpose-stamped and pre-response-stamped AMCL poses cannot satisfy no-motion
    callback: tag/map/pose/costmap work released after FAULT cannot commit
  cancel: cancelled action remains PREEMPTED with blank-floor FAULT and no resume
  hanging: no-motion/change-map response timeout fails closed
  late: delayed target map after terminal FAULT cannot increment generation
  generated: generated ROS action/message interfaces and catkin registration pass the full suite
  dirty: malformed occupancy values and dirty mixed tag arrays remain rejected by root tests
  misleading:
    wrong_map: matching metadata with wrong data hash cannot advance generation
    wrong_tf: scan without the required transform chain cannot localize
    wrong_costmap: mismatched costmap metadata cannot complete the action
  repeated_evidence: fresh timestamped TF, odometry, and scan publication remains event-driven until acknowledged
verification:
  focused_matrix:
    command: two sequential cycles of floor_transition_ros, cancel, late_map, delayed_pose, and epoch rostests
    result: every test passed in both cycles
    coverage: [success, failure, cancel, hanging_service, late_map, delayed_pose, tag_epoch, map_epoch, pose_epoch, costmap_epoch]
  delayed_pose_after_final_assertion: "PASS - 1 test, 0 errors, 0 failures"
  root: "PASS - python3 -m unittest discover -s test -v - 65 tests"
  sequential_catkin:
    command: catkin_make -j1 run_tests && catkin_test_results --verbose build/test_results
    repetitions_after_final_edit: 2
    each_result: "145 tests, 0 errors, 0 failures, 0 skipped"
  bundle: "PASS - ./run.sh --check - BUNDLE_OK"
  diagnostics: 0 diagnostics in every final-fix Python file
  pure_loc:
    ros_node.py: 246
    test_floor_transition_delayed_pose_ros.py: 164
    test_floor_transition_epoch_ros.py: 183
  production_init_nodes: [mission_manager, multifloor_manager, stair_supervisor]
cleanup:
