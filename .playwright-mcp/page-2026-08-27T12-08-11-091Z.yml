            - generic [ref=e228]: "import actionlib from actionlib_msgs.msg import GoalStatus from move_base_msgs.msg import MoveBaseAction, MoveBaseGoal from stair_supervisor.msg import SupervisorState if not ARM_MOTION: raise RuntimeError(\"motion is disarmed; verify the site and set ARM_MOTION = True\") supervisor = rospy.wait_for_message(\"/stair_supervisor/state\", SupervisorState, timeout=5.0) if supervisor.state != 1 or not supervisor.connected: raise RuntimeError(f\"stair supervisor must be NAV(1) and connected: {supervisor}\") MOVE_BASE_CLIENT = actionlib.SimpleActionClient(\"/move_base\", MoveBaseAction) if not MOVE_BASE_CLIENT.wait_for_server(rospy.Duration(10.0)): raise RuntimeError(\"/move_base action server is unavailable\") goal = MoveBaseGoal() goal.target_pose.header.frame_id = \"map\" goal.target_pose.header.stamp = rospy.Time.now() goal.target_pose.pose.position.x = GOAL_X goal.target_pose.pose.position.y = GOAL_Y goal.target_pose.pose.orientation.z = math.sin(GOAL_YAW / 2.0) goal.target_pose.pose.orientation.w = math.cos(GOAL_YAW / 2.0) MOVE_BASE_CLIENT.send_goal(goal) finished = MOVE_BASE_CLIENT.wait_for_result(rospy.Duration(GOAL_TIMEOUT_SEC)) if not finished: MOVE_BASE_CLIENT.cancel_goal() raise RuntimeError(f\"navigation timed out after {GOAL_TIMEOUT_SEC}s and was cancelled\") state = MOVE_BASE_CLIENT.get_state() if state != GoalStatus.SUCCEEDED: raise RuntimeError(f\"navigation failed: state={state} text={MOVE_BASE_CLIENT.get_goal_status_text()}\") print(f\"navigation succeeded: x={GOAL_X} y={GOAL_Y} yaw={GOAL_YAW}\")"
